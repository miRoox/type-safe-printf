name: build
on: 
  - push
  - pull_request
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: install CMake
      run: python -m pip install --upgrade "cmake==4.4.4"
    - name: configure
      run: |
        cmake --version
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
    - name: build
      run: cmake --build build --config Debug
    - name: test
      run: ctest --test-dir build -C Debug --output-on-failure
